<!DOCTYPE html>
{% load  static %}
{% load widget_tweaks %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>InsuraCore Login</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-card {
      background: #fff;
      width: 420px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      overflow: hidden;
      animation: fadeIn 0.8s ease-in-out;
    }

    /* TOP IMAGE */
    .login-header {
      height: 150px;
      background: url("{% static 'image/login.jpg' %}") no-repeat center center;
      background-size: cover;
    }

    .login-body {
      padding: 30px 35px;
    }

    .login-body h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 25px;
      color: #003d5c; /* Deep InsuraCore Blue */
      text-align: left;
    }

    /* Inputs */
    .form-control {
      width: 100%;
      padding: 12px;
      padding-left: 10px;
      margin-bottom: 18px;
      border: 1px solid #dce3ee;
      border-radius: 6px;
      font-size: 14px;
      transition: 0.3s;
    }

    .form-control:focus {
      border-color: #00b3b3; /* InsuraCore Aqua */
      outline: none;
      box-shadow: 0 0 6px rgba(0,179,179,0.3);
    }

    /* Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(90deg, #00b3b3, #007a99);
      padding: 12px;
      color: #fff;
      border: none;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-submit:hover {
      background: linear-gradient(90deg, #00cccc, #006680);
    }

    /* Fade Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

  {% include "insurance/navbar.html" %}

  <div class="login-card">
    <div class="login-header"></div>

    <div class="login-body">
      <h2>Sign In</h2>

      <form method="post">
        {% csrf_token %}
        {% render_field form.username class="form-control" placeholder="Username" autocomplete="off" %}
        {% render_field form.password class="form-control" placeholder="Password" %}

        <button type="submit" class="btn-submit">Login</button>
      </form>
    </div>
  </div>

</body>
</html>
