{% extends 'insurance/adminbase.html' %}
{% load widget_tweaks %}
{% block content %}
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="http://netdna.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <style>
       
  a:link {
        text-decoration: none;
      }

  /* Primary Theme Color (Sky Blue) */
  :root {
      --color-primary: #1E90FF; /* Dodger Blue */
      --color-light-blue: #00BFFF; /* Deep Sky Blue */
      --color-header-text: #ffffff;
      --color-shadow: rgba(0, 0, 0, 0.1);
      --color-background: #f8f9fa;
  }

  body {
      background-color: var(--color-background);
  }

  /* Modern Form Card Container */
  .form-card {
      max-width: 550px; /* Max width for a clean, focused form */
      margin: 50px auto; /* Center the card horizontally */
      background: #ffffff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 8px 15px var(--color-shadow);
      overflow: hidden; /* Contains the header border-radius */
  }

  /* Card Header Styling */
  .card-header-custom {
      background-color: var(--color-primary);
      color: var(--color-header-text);
      padding: 20px;
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      border-bottom: 5px solid var(--color-light-blue);
  }

  /* Card Body Padding */
  .card-body-custom {
      padding: 35px;
  }

  /* Input Styling */
  .form-control {
      border-radius: 6px;
      border: 1px solid #ced4da;
      padding: 10px 15px;
      height: auto;
  }
  .form-control:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 0.2rem rgba(30, 144, 255, 0.25);
  }

  /* Button Styling */
  .btn-primary-custom {
      background-color: var(--color-primary);
      border-color: var(--color-primary);
      font-weight: 600;
      padding: 10px 25px;
      border-radius: 50px; /* Pill shape */
      width: 100%;
      margin-top: 15px;
      transition: background-color 0.3s ease;
  }
  .btn-primary-custom:hover {
      background-color: var(--color-light-blue);
      border-color: var(--color-light-blue);
  }

  </style>
</head>

<div class="container">
    <div class="form-card">

        <div class="card-header-custom">
            <i class="fas fa-layer-group"></i> Add New Category
        </div>

        <div class="card-body-custom">
            <form method="POST" autocomplete="off">
                {%csrf_token%}

                <div class="form-group">
                    <label for="{{ categoryForm.category_name.id_for_label }}" style="font-weight: 600;">Category Name</label>
                    {% render_field categoryForm.category_name class="form-control" placeholder="e.g., Life Insurance, Vehicle Policy" %}
                </div>

                <br>
                <button type="submit" class="btn btn-primary-custom">
                    <i class="fas fa-plus-circle"></i> ADD CATEGORY
                </button>
            </form>
        </div>
    </div>
</div>

<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
{% endblock content %}
